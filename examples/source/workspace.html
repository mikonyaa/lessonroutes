<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Practice workspace — original example artwork</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7f2;color:#26352c;font:18px "Trebuchet MS",sans-serif}.bar{height:80px;border-bottom:1px solid #d5ddd1;background:white;display:flex;align-items:center;justify-content:space-between;padding:0 44px}.brand{font:bold 25px Georgia,serif}.tag{font-size:14px;color:#56715d}.layout{display:grid;grid-template-columns:250px 1fr;height:640px}aside{padding:32px 24px;border-right:1px solid #d5ddd1}aside div{padding:17px;border-radius:5px;color:#5c6a5c}aside .active{background:#e1eadf;color:#304f38;font-weight:bold}main{padding:44px 60px}.kicker{text-transform:uppercase;letter-spacing:2px;color:#58765b;font-size:13px}h1{font:normal 38px Georgia,serif;margin:14px 0}p{color:#617161;margin:12px 0 30px}.choices{display:flex;gap:24px;margin-top:44px}.choice{background:white;border:1px solid #c9d5c7;border-radius:7px;padding:24px;width:245px;height:170px}.choice b{display:block;font-size:21px;margin-bottom:12px}.choice span{font-size:16px;color:#617161}.foot{position:absolute;bottom:36px;left:310px;font-size:13px;color:#71806d}button{font:inherit;color:white;background:#3c6044;border:0;padding:16px 30px;border-radius:5px;margin-top:26px}.pill{display:inline-block;color:#406a42;background:#e1ecdd;padding:8px 16px;border-radius:4px;font-size:14px}
</style></head><body><header class="bar"><div class="brand">Practice workspace</div><span class="tag">A fictional interface · sample data only</span></header><div class="layout"><aside><div>01 &nbsp; Visibility</div><div>02 &nbsp; Invitations</div><div>03 &nbsp; Notifications</div><div>04 &nbsp; Recovery</div><div>05 &nbsp; Review</div></aside><main></main></div><div class="foot">Original LessonRoutes teaching materials · no accounts or personal information</div><script>
const steps=[
 {title:'Choose workspace visibility',desc:'Your class needs a quiet place to practise. Who should see this workspace?',choices:[['Public','Anyone can discover the workspace.'],['Private','Only invited learners can access it.'],['Shared link','Anyone with the link can enter.']]},
 {title:'Invite your practice group',desc:'Invite a small group using their classroom code. Keep access intentional.',choices:[['Invite with class code','Only your classroom group.'],['Invite everyone','Open invitation to all groups.']]},
 {title:'Set notification preferences',desc:'Keep important updates while leaving space for focused work.',choices:[['Essential only','Tasks and important class changes.'],['Every activity','A notification for every click.']]},
 {title:'Prepare a recovery copy',desc:'A manual copy protects your work if this browser storage is cleared.',choices:[['Download a backup','Keep a copy you can open again.'],['Skip backup','Rely only on this browser.']]},
 {title:'Review your workspace',desc:'Private access. Intentional invitations. Essential updates. A recovery copy.',choices:[['Apply settings','Create the practice workspace.']]}
];const step=Math.max(0,Math.min(4,Number(new URLSearchParams(location.search).get('step')||0)));const data=steps[step];const main=document.querySelector('main');const k=document.createElement('div');k.className='kicker';k.textContent='Workspace setup / '+String(step+1).padStart(2,'0');const h=document.createElement('h1');h.textContent=data.title;const p=document.createElement('p');p.textContent=data.desc;main.append(k,h,p);const choices=document.createElement('div');choices.className='choices';for(const [title,desc] of data.choices){const c=document.createElement('div');c.className='choice';const b=document.createElement('b');b.textContent=title;const s=document.createElement('span');s.textContent=desc;c.append(b,s);choices.append(c)}main.append(choices);document.querySelectorAll('aside div')[step].className='active';
</script></body></html>
